[package]
name = "deep-voice-privilege"
version = "1.0.0"
edition = "2024"
description = "Pitch-shift your mic into a virtual audio device so meeting apps hear a deeper voice"
license = "MIT-0"
repository = "https://github.com/gordlea/deep-voice-privilege"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# macOS: CoreAudio, Windows: WASAPI. Linux adds the PulseAudio backend below.
cpal = "0.18.2"
ctrlc = "3.5.2"
ratatui = "0.30.2"
ringbuf = "0.5.3"
rustfft = "6.4.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust PulseAudio protocol client; works with PulseAudio and PipeWire (pipewire-pulse).
# Unlike raw ALSA it can see and target a specific sink, e.g. the virtual "deepvoice" sink.
cpal = { version = "0.18.2", features = ["pulseaudio"] }

[features]
# Native PipeWire backend (lowest latency). Needs libpipewire-0.3 headers and clang to build.
pipewire = ["cpal/pipewire"]
